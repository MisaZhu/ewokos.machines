# SC8280XP exposes eight application cores.  All secondaries use PSCI,
# per-core GIC redistributors, SGI scheduling and private kernel stacks.
cores = 8
timer_freq = 1024 #kernel timer  FPS, 0 for default freq
uart_baud = 115200

max_proc_num = 128
max_task_per_proc = 64

# The Q8B has 8GB of DRAM. Firmware-owned holes are excluded using the final
# UEFI memory map; size the kernel pools explicitly for the GUI stack.
kmalloc_size = 128M
dma_size = 256M
shm_contig_size = 512M
