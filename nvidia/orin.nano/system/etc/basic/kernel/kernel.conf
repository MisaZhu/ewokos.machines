# Orin Nano: 6 Cortex-A78AE cores (two clusters, 4+2).  Secondaries come up
# through PSCI with per-core GICv3 redistributors, SGI scheduling and private
# kernel stacks.
cores = 6
timer_freq = 1024 #kernel timer FPS, 0 for default freq
uart_baud = 115200

# Bring-up port: keep the boot RAMFS as root (serial rescue console); no
# persistent-disk driver is packed yet, so switchroot never runs.
rootfs = self

max_proc_num = 128
max_task_per_proc = 64

# 8GB DRAM; firmware-owned holes are excluded through the final UEFI memory
# map.  A 4K GPU render target needs ~100MB of contiguous shm (fb + depth,
# 1.5x grow headroom each); 512M is the kernel's contig window limit.
kmalloc_size = 128M
dma_size = 64M
# GPU-only DMA pool above 4GB (GA10B GMMU has no DMA32 limit): Qwen3-4B
# Q4_K_M needs ~2.33G weights + ~0.6G KV(2048 ctx) + driver buffers.
gpu_dma_size = 3584M
shm_contig_size = 512M