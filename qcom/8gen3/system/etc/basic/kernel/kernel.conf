# SC8280XP exposes eight application cores.  All secondaries use PSCI,
# per-core GIC redistributors, SGI scheduling and private kernel stacks.
cores = 8
timer_freq = 1024 #kernel timer  FPS, 0 for default freq
uart_baud = 115200

# initramfs policy: use the boot source first, then SD -> USB -> NVMe -> NET.
# nvme: sdfsd -n mounts the first ext3 partition of the NVMe disk as rootfs.
rootfs = nvme

max_proc_num = 128
max_task_per_proc = 64

# The QCOM8GEN3 has 8GB of DRAM. Firmware-owned holes are excluded using the final
# UEFI memory map; size the kernel pools explicitly for the GUI stack.
kmalloc_size = 128M
# dma_size/dma_base configure the DMA-reachable RANGE (non-exclusive; normal
# allocation shares it). Omitted = BSP hardware range (below 4GB, Adreno
# SMMU identity). The old 256M pool size must NOT stay as a range cap.
#dma_size = 4G
