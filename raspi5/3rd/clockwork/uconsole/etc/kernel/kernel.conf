cores = 0 # 0 for cpu max cores
timer_freq = 1024 #kernel timer  FPS, 0 for default freq
uart_baud = 19200

max_proc_num = 128
max_task_per_proc = 64

# CM5 2G/4G variants: mem-size table gives kmalloc 16M / dma 32M, too tight
# for the full xwin stack (16G boards get 64M/64M); pin both to 64M explicitly.
dma_size = 64M
shm_contig_size = 128M
kmalloc_size = 64M